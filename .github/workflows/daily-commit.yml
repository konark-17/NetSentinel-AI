name: Daily Automated Commit

on:
  schedule:
    # Runs everyday at 00:00 UTC (12:00 AM UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Daily Activity Log
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "| $TIMESTAMP | Active | Automated daily sync & security check |" >> ACTIVITY.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ACTIVITY.md
          git commit -m "chore(daily): automated sync $(date -u +'%Y-%m-%d')" || exit 0
          git push
